[project]
name = "unreliable-assistant"
version = "0.2.0"
description = "Enterprise MCP agent Build v0.2: tenant-isolated bounded agent, routing, guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "httpx>=0.28",
  "groq>=0.15",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "rank-bm25>=0.2",
  "streamlit>=1.41",
  "onnxruntime>=1.20",
  "faiss-cpu>=1.9",
  "numpy>=2.0",
  "nltk>=3.8",
  "python-dotenv>=1.0",
  "pluggy>=1.5",
  "prometheus-client>=0.21",
  "mcp>=1.2,<2",  # rag_server uses mcp.server.fastmcp, removed in mcp 2.x
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.10",
  "bandit>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: end-to-end check of the built system's critical path; run on every pipeline",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["_parked_code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["nltk.*", "groq.*", "redis.*", "rank_bm25.*", "mcp.*", "prometheus_client.*"]
ignore_missing_imports = true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-security:
    name: Lint, types, security (3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Lint
        run: make lint PY=python
      - name: Type check
        run: make typecheck PY=python
      - name: Security scan
        run: make security PY=python

  test:
    name: Test and coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -q -e ".[dev]"
      - name: Test with coverage gate (fails under 90%)
        run: make test PY=python
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (py${{ matrix.python-version }})"
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  package-smoke:
    name: Package and smoke test (3.12)
    needs: [lint-typecheck-security, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: make build PY=python
      - name: Install wheel into clean venv and run smoke suite
        run: make smoke-installed PY=python
      - name: Smoke summary
        if: always()
        run: |
          {
            echo "### Smoke suite (installed wheel)"
            echo '```'
            cat smoke-report.txt 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload distribution and smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-and-smoke
          path: |
            dist/
            smoke-report.txt
          if-no-files-found: warn
